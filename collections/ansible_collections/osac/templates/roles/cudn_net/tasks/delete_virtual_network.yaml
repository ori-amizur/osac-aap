---
# Delete the shared ClusterUserDefinedNetwork for the VirtualNetwork.
# Must only be called after all subnets (and their namespaces) are deleted.

- name: Include get remote cluster kubeconfig
  ansible.builtin.include_role:
    name: osac.service.common
    tasks_from: get_remote_cluster_kubeconfig

- name: Extract VirtualNetwork name
  ansible.builtin.set_fact:
    vn_name: "{{ virtual_network.metadata.name }}"

- name: Display deletion information
  ansible.builtin.debug:
    msg:
      - "Deleting shared CUDN for VirtualNetwork '{{ vn_name }}'"

- name: Delete shared ClusterUserDefinedNetwork
  kubernetes.core.k8s:
    kubeconfig: "{{ remote_cluster_kubeconfig | default(omit) }}"
    state: absent
    api_version: k8s.ovn.org/v1
    kind: ClusterUserDefinedNetwork
    name: "{{ vn_name }}"
    wait: true
    wait_timeout: 300
  register: cudn_delete_result
  failed_when:
    - cudn_delete_result.failed | default(false)
    - "'NotFound' not in (cudn_delete_result.msg | default(''))"

- name: Display deletion result
  ansible.builtin.debug:
    msg:
      - "Shared CUDN '{{ vn_name }}' deletion completed"
      - "Changed: {{ cudn_delete_result.changed | default(false) }}"
